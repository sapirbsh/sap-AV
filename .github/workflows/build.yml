name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults

      # Turn each failed test into a public check-run annotation (test name + first lines of the error),
      # so failures can be read without downloading the log or the artifact.
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          $count = 0
          foreach ($trx in Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$doc = Get-Content $trx.FullName -Raw
            $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
            foreach ($r in (Select-Xml -Xml $doc -XPath "//t:UnitTestResult[@outcome='Failed']" -Namespace $ns)) {
              $name = $r.Node.testName
              $msg  = ($r.Node.Output.ErrorInfo.Message + ' | ' + $r.Node.Output.ErrorInfo.StackTrace) -replace "`r?`n", ' '
              if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
              $msg = $msg -replace '%', '%25'
              Write-Output "::error title=$name::$msg"
              $count++
              if ($count -ge 20) { break }
            }
          }
          Write-Output "Failed tests annotated: $count"

      # Publish the elevated persistence-collection timings as a public notice (the runner is elevated, dev runs usually aren't).
      - name: Report elevated collection timings
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $found = 0
          try {
            foreach ($trx in @(Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue)) {
              [xml]$doc = Get-Content -LiteralPath $trx.FullName -Raw
              $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
              $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
              foreach ($node in @($doc.SelectNodes("//t:UnitTestResult[contains(@testName,'RealMachine_CollectsWithinBudget')]", $ns))) {
                $stdout = $node.SelectSingleNode('t:Output/t:StdOut', $ns)
                $out = if ($stdout) { $stdout.InnerText } else { '(no output captured)' }
                $out = ($out -replace "`r?`n", ' ') -replace '%', '%25'
                if ($out.Length -gt 900) { $out = $out.Substring(0, 900) }
                Write-Output "::notice title=Elevated collection timings::$out"
                $found++
              }
            }
            if ($found -eq 0) { Write-Output "::notice title=Elevated collection timings::test result not found in TRX" }
          } catch {
            $msg = "$_" -replace '%', '%25' -replace "`r?`n", ' '
            Write-Output "::notice title=Elevated collection timings::script error: $msg"
          }
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
