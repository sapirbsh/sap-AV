name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestResults

      # Turn each failed test into a public check-run annotation (test name + first lines of the error),
      # so failures can be read without downloading the log or the artifact.
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $count = 0
          try {
            foreach ($trx in @(Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue)) {
              [xml]$doc = Get-Content -LiteralPath $trx.FullName -Raw
              $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
              $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
              $counters = $doc.SelectSingleNode('//t:ResultSummary/t:Counters', $ns)
              if ($counters) {
                Write-Output "::notice title=$($trx.Name)::total $($counters.total), passed $($counters.passed), failed $($counters.failed), aborted $($counters.aborted), timeout $($counters.timeout)"
              }
              foreach ($node in @($doc.SelectNodes("//t:UnitTestResult[@outcome!='Passed' and @outcome!='NotExecuted']", $ns))) {
                $name = [string]$node.GetAttribute('testName')
                $m = $node.SelectSingleNode('t:Output/t:ErrorInfo/t:Message', $ns)
                $s = $node.SelectSingleNode('t:Output/t:ErrorInfo/t:StackTrace', $ns)
                $msg = "$($node.GetAttribute('outcome')): " + $(if ($m) { $m.InnerText } else { '' }) + ' | ' + $(if ($s) { $s.InnerText } else { '' })
                $msg = ($msg -replace "`r?`n", ' ') -replace '%', '%25'
                if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
                $name = ($name -replace '%', '%25') -replace '[:,]', '_'
                Write-Output "::error title=$name::$msg"
                $count++
                if ($count -ge 20) { break }
              }
            }
            # A crashed or hung test host leaves its message in the run-level output, not in a test result.
            foreach ($trx in @(Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue)) {
              [xml]$doc = Get-Content -LiteralPath $trx.FullName -Raw
              $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
              $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
              foreach ($t in @($doc.SelectNodes('//t:ResultSummary/t:RunInfos/t:RunInfo/t:Text', $ns))) {
                $msg = ($t.InnerText -replace "`r?`n", ' ') -replace '%', '%25'
                if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
                Write-Output "::error title=Test run message::$msg"
              }
            }
          } catch {
            $msg = "$_" -replace '%', '%25' -replace "`r?`n", ' '
            Write-Output "::error title=Annotate step error::$msg"
          }
          Write-Output "Failed tests annotated: $count"
          exit 0

      # Publish the elevated persistence-collection timings as a public notice (the runner is elevated, dev runs usually aren't).
      - name: Report elevated collection timings
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $found = 0
          try {
            foreach ($trx in @(Get-ChildItem TestResults -Filter *.trx -ErrorAction SilentlyContinue)) {
              [xml]$doc = Get-Content -LiteralPath $trx.FullName -Raw
              $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
              $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
              foreach ($node in @($doc.SelectNodes("//t:UnitTestResult[contains(@testName,'RealMachine_CollectsWithinBudget')]", $ns))) {
                $stdout = $node.SelectSingleNode('t:Output/t:StdOut', $ns)
                $out = if ($stdout) { $stdout.InnerText } else { '(no output captured)' }
                $out = ($out -replace "`r?`n", ' ') -replace '%', '%25'
                if ($out.Length -gt 900) { $out = $out.Substring(0, 900) }
                Write-Output "::notice title=Elevated collection timings::$out"
                $found++
              }
            }
            if ($found -eq 0) { Write-Output "::notice title=Elevated collection timings::test result not found in TRX" }
          } catch {
            $msg = "$_" -replace '%', '%25' -replace "`r?`n", ' '
            Write-Output "::notice title=Elevated collection timings::script error: $msg"
          }
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
